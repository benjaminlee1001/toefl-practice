<title>TOEFL 練習 (iBT 2026)</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --border:#dce0e6;
  --text:#1d2430; --muted:#66707c; --accent:#2f6f8f; --accent2:#3a7d5d;
  --ok:#2e7d46; --bad:#b23b3b; --warn:#a86a1f; --chip:#e7edf2;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,"Segoe UI","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161a1f; --panel:#1f252c; --panel2:#262d35; --border:#333c46;
    --text:#e6e9ee; --muted:#98a2ae; --accent:#5fa9c9; --accent2:#6fc194;
    --ok:#6ac585; --bad:#e58585; --warn:#e0b467; --chip:#2b333c;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--border);
  background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text],textarea,select{font-family:inherit;font-size:15px;color:var(--text);
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%}
textarea{line-height:1.7;resize:vertical}
a{color:var(--accent)}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.topbar .grow{flex:1}
.saveinfo{font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin:14px 0}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:18px 0 6px;font-size:15px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border-radius:999px}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;margin:2px}
.tag-review{background:var(--accent2);color:#fff}
.eng{font-family:var(--serif)}
.muted{color:var(--muted)}
.small{font-size:13px}
.reveal{margin-top:8px}
.reveal-body{margin-top:8px;padding:12px;background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.blank-input{display:inline-block;width:auto;min-width:70px;padding:2px 6px;font-family:var(--serif)}
.blank-ok{border-color:var(--ok);background:rgba(46,125,70,.12)}
.blank-bad{border-color:var(--bad);background:rgba(178,59,59,.12)}
.optbtn{display:block;width:100%;text-align:left;margin:4px 0}
.optbtn.sel{border-color:var(--accent);background:var(--panel2)}
.optbtn.correct{border-color:var(--ok);background:rgba(46,125,70,.15)}
.optbtn.wrong{border-color:var(--bad);background:rgba(178,59,59,.15)}
.passage{font-family:var(--serif);line-height:2;white-space:pre-wrap;background:var(--panel2);padding:14px;border-radius:8px}
.chunk{display:inline-block;background:var(--chip);border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;margin:4px;cursor:pointer;font-family:var(--serif)}
.chunk.used{opacity:.35;pointer-events:none}
.answer-slot{min-height:44px;border:1px dashed var(--border);border-radius:8px;padding:8px;margin:6px 0;font-family:var(--serif)}
.answer-slot .chunk{cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.rec-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:600}
.transcript-box{min-height:64px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  margin:8px 0;background:var(--panel2);white-space:pre-wrap;line-height:1.7;font-family:var(--serif)}
.transcript-box.empty{color:var(--muted);font-style:italic}
.hl{background:rgba(168,106,31,.28);border-radius:3px;padding:0 2px}
.diff-del{color:var(--muted);text-decoration:line-through}
.diff-ins{color:var(--bad);text-decoration:underline}
.list-row{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);
  border-radius:8px;margin:6px 0;flex-wrap:wrap}
.list-row .grow{flex:1;min-width:200px}
.bar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.band{font-size:22px;font-weight:700;color:var(--accent)}
.loading{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:left;font-size:14px}
.notice{background:rgba(168,106,31,.15);border:1px solid var(--warn);border-radius:8px;padding:10px;margin:10px 0}
.scoreline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0}
label.blk{display:block;margin:6px 0}
</style>

/* ============================================================
   Util
   ============================================================ */
const Util={
  $(sel,root){return (root||document).querySelector(sel);},
  el(tag,attrs,kids){
    const e=document.createElement(tag);
    if(attrs)for(const k in attrs){
      if(k==="class")e.className=attrs[k];
      else if(k==="html")e.innerHTML=attrs[k];
      else if(k==="text")e.textContent=attrs[k];
      else if(k.startsWith("on")&&typeof attrs[k]==="function")e.addEventListener(k.slice(2),attrs[k]);
      else if(attrs[k]!=null)e.setAttribute(k,attrs[k]);
    }
    (kids||[]).forEach(c=>{if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});
    return e;
  },
  debounce(fn,ms){let t;return function(){clearTimeout(t);const a=arguments,c=this;t=setTimeout(()=>fn.apply(c,a),ms);};},
  esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));},
  now(){return new Date().toISOString();},
  stamp(d){d=d||new Date();const p=n=>String(n).padStart(2,"0");
    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());},
  fmtTime(iso){if(!iso)return"";const d=new Date(iso);const p=n=>String(n).padStart(2,"0");
    return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;},
  daysBetween(a,b){return Math.floor((b-a)/86400000);},
  shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample(arr,n){return Util.shuffle(arr).slice(0,n);},
  uid(){return Math.random().toString(36).slice(2,9);},
  normWords(s){return String(s||"").toLowerCase().replace(/[^\p{L}\p{N}\s']/gu," ").split(/\s+/).filter(Boolean);},
  // word-level Levenshtein alignment -> ops array
  align(a,b){
    const n=a.length,m=b.length;
    const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
    for(let i=0;i<=n;i++)dp[i][0]=i;
    for(let j=0;j<=m;j++)dp[0][j]=j;
    const near=(x,y)=>{if(x===y)return true;if(Math.abs(x.length-y.length)>1)return false;
      // 1-edit distance
      let i=0,j=0,e=0;while(i<x.length&&j<y.length){if(x[i]===y[j]){i++;j++;}else{e++;if(e>1)return false;
        if(x.length>y.length)i++;else if(y.length>x.length)j++;else{i++;j++;}}}
      return e+ (x.length-i)+(y.length-j)<=1;};
    for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
      const cost=near(a[i-1],b[j-1])?0:1;
      dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+cost);
    }
    // backtrace
    let i=n,j=m;const ops=[];
    while(i>0||j>0){
      if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(near(a[i-1],b[j-1])?0:1)){
        ops.push({t:near(a[i-1],b[j-1])?"match":"sub",a:a[i-1],b:b[j-1]});i--;j--;
      }else if(i>0&&dp[i][j]===dp[i-1][j]+1){ops.push({t:"del",a:a[i-1]});i--;}
      else{ops.push({t:"ins",b:b[j-1]});j--;}
    }
    ops.reverse();return ops;
  },
};

   DB — IndexedDB
   ============================================================ */
const DB={
  db:null,
  open(){
    return new Promise((res,rej)=>{
      const req=indexedDB.open(CFG.DB_NAME,CFG.DB_VERSION);
      req.onupgradeneeded=e=>{
        const db=req.result,old=e.oldVersion;
        if(old<1){
          db.createObjectStore("sessions",{keyPath:"id"});
          db.createObjectStore("audio",{keyPath:"audioId"});
          db.createObjectStore("meta",{keyPath:"key"});
          const qb=db.createObjectStore("questionBank",{keyPath:"_pk"});
          qb.createIndex("type","type");
          qb.createIndex("topic","topic");
          qb.createIndex("level","level");
        }
        // 未來版本遷移放這裡：if(old<2){...}
      };
      req.onsuccess=()=>{DB.db=req.result;res(DB.db);};
      req.onerror=()=>rej(req.error);
      req.onblocked=()=>alert("請關閉其他開著本網站的分頁後再重試（資料庫升級被佔用）。");
    });
  },
  tx(store,mode){return DB.db.transaction(store,mode||"readonly").objectStore(store);},
  get(store,key){return new Promise((res,rej)=>{const r=DB.tx(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  getAll(store){return new Promise((res,rej)=>{const r=DB.tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});},
  put(store,val){return new Promise((res,rej)=>{const r=DB.tx(store,"readwrite").put(val);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});},
  del(store,key){return new Promise((res,rej)=>{const r=DB.tx(store,"readwrite").delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});},
  clear(store){return new Promise((res,rej)=>{const r=DB.tx(store,"readwrite").clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});},
  async metaGet(key,def){const v=await DB.get("meta",key);return v?v.value:def;},
  async metaSet(key,value){await DB.put("meta",{key,value});},
};

   Bank — 題庫存取 / 匯入 / 驗證 / 抽題
   ============================================================ */
const Bank={
  // 把題庫檔攤平成 questionBank store 的每筆紀錄
  flatten(bank){
    const rows=[];const push=(type,arr)=>{(arr||[]).forEach(o=>{
      // 注意：category(type) 必須蓋過 o 自帶的 type（speaking 物件有 listen_repeat/interview 等），
      // 原始子類型保留在 subtype。
      rows.push(Object.assign({},o,{_pk:type+":"+(o.id||Util.uid()),type,subtype:o.type||null}));});};
    push("vocab",(bank.vocab||[]).map((v,i)=>Object.assign({id:v.id||("v_"+i)},v)));
    push("completeWords",bank.completeWords);
    push("dailyLifeReading",bank.dailyLifeReading);
    push("cloze",bank.cloze);
    push("buildSentence",bank.buildSentence);
    push("translation",bank.translation);
    push("speaking",bank.speaking);
    push("writeEmail",bank.writeEmail);
    return rows;
  },
  validate(bank){
    const enums=bank.enums||SEED_BANK.enums;
    const inEnum=(v,k)=>!v||!enums[k]||enums[k].includes(v);
    const good=[],skipped=[];
    const rows=Bank.flatten(bank);
    rows.forEach(r=>{
      const reasons=[];
      if(!r.type)reasons.push("缺 type");
      if(r.topic&&!inEnum(r.topic,"topic"))reasons.push("topic 不在清單:"+r.topic);
      if(r.level&&!inEnum(r.level,"level"))reasons.push("level 不在清單:"+r.level);
      if(r.type==="cloze"&&r.items)r.items.forEach(it=>{if(it.errorType&&!inEnum(it.errorType,"errorType"))reasons.push("errorType:"+it.errorType);});
      if((r.type==="buildSentence"||r.type==="translation")&&r.structure&&!inEnum(r.structure,"structure"))reasons.push("structure:"+r.structure);
      if(reasons.length)skipped.push({id:r._pk,reasons});else good.push(r);
    });
    return {good,skipped};
  },
  async import(bank,mode){
    const {good,skipped}=Bank.validate(bank);
    if(mode==="replace")await DB.clear("questionBank");
    for(const r of good)await DB.put("questionBank",r);
    await DB.metaSet("bankMeta",{version:bank.version,format:bank.format,importedAt:Util.now()});
    return {imported:good.length,skipped};
  },
  async all(){return await DB.getAll("questionBank");},
  async byType(type){const rows=await Bank.all();return rows.filter(r=>r.type===type);},
  async isEmpty(){const rows=await Bank.all();return rows.length===0;},
  async status(){
    const rows=await Bank.all();const byType={},topics=new Set(),levels=new Set();
    rows.forEach(r=>{byType[r.type]=(byType[r.type]||0)+1;if(r.topic)topics.add(r.topic);if(r.level)levels.add(r.level);});
    return {total:rows.length,byType,topics:[...topics],levels:[...levels]};
  },
  // 依主題/難度過濾抽題；level 傳 null 表不限
  pick(rows,type,topics,level,n){
    let pool=rows.filter(r=>r.type===type);
    if(topics&&topics.length)pool=pool.filter(r=>!r.topic||topics.includes(r.topic));
    let leveled=level?pool.filter(r=>r.level===level):pool;
    if(leveled.length<n)leveled=pool; // 不夠就放寬難度
    return Util.sample(leveled,Math.min(n,leveled.length));
  },
};

/* ============================================================
   Session — 當前回合狀態（唯一來源）
   ============================================================ */
const Session={
  cur:null,
  async list(){const s=await DB.getAll("sessions");return s.sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));},
  async load(id){Session.cur=await DB.get("sessions",id);return Session.cur;},
  async save(){if(Session.cur){Session.cur.updatedAt=Util.now();await DB.put("sessions",Session.cur);Persist.flash();}},

  async create(config){
    const rows=await Bank.all();
    const level=config.level==="auto"?await Session.autoLevel():config.level;
    const src=config.source||"mixed";
    const topics=config.topics;
    const due=await Review.due();

    // 決定用題庫或生成
    const wantGen=(t)=>src==="generate"||(src==="mixed"&&["speaking","writeEmail"].includes(t));

    const s={
      id:"session_"+Util.stamp()+"_"+Util.uid(),
      createdAt:Util.now(),updatedAt:Util.now(),status:"in_progress",
      config:{topics,level,source:src},
      levelUsed:level,
      vocab:[],reading:{},syntax:{},speaking:{},writing:[],
      vocabRepetition:{translation:[],interview:[],email:[]},
      bands:{reading:null,syntax:null,speaking:null,writing:null,overall:null},
      _reviewNote:[],
    };

    // --- 單字（含複習）：保證 10 個不重複，逐層放寬補滿 ---
    const usedV=new Set();
    const addVocab=(w,fromReview)=>{if(!w||usedV.has(w._pk)||s.vocab.length>=10)return;usedV.add(w._pk);s.vocab.push(mkVocab(w,fromReview));};
    const allVocab=rows.filter(r=>r.type==="vocab");
    const inTopic=w=>!topics.length||!w.topic||topics.includes(w.topic);
    // 1) 複習字（最多 3）
    due.filter(d=>d.type==="vocab").slice(0,3).forEach(r=>addVocab(rows.find(x=>x._pk===r.itemId),true));
    // 2) 同主題同難度 → 3) 同主題不限難度 → 4) 全題庫，逐層補滿到 10
    Util.shuffle(allVocab.filter(w=>inTopic(w)&&w.level===level)).forEach(w=>addVocab(w,false));
    Util.shuffle(allVocab.filter(inTopic)).forEach(w=>addVocab(w,false));
    Util.shuffle(allVocab).forEach(w=>addVocab(w,false));

    // --- 閱讀 ---
    const cw=Bank.pick(rows,"completeWords",topics,level,1)[0];
    const dlr=Bank.pick(rows,"dailyLifeReading",topics,level,1)[0];
    const cz=Bank.pick(rows,"cloze",topics,level,1)[0];
    s.reading.completeWords=cw?{srcId:cw._pk,instruction:cw.instruction,passage:cw.passage,
      items:cw.items.map(it=>({id:it.id,hint:it.hint,answer:it.answer,explanation:it.explanation,purpose:it.purpose,userAnswer:"",revealed:false}))}:null;
    s.reading.dailyLife=dlr?{srcId:dlr._pk,textType:dlr.textType,passage:dlr.passage,
      items:dlr.items.map(it=>({id:it.id,question:it.question,options:it.options,answer:it.answer,explanation:it.explanation,purpose:it.purpose,userAnswer:null,revealed:false}))}:null;
    s.reading.cloze=cz?{srcId:cz._pk,passage:cz.passage,
      items:cz.items.map(it=>({id:it.id,options:it.options,answer:it.answer,errorType:it.errorType,explanation:it.explanation,purpose:it.purpose,userAnswer:null,revealed:false}))}:null;

    // --- 句構 ---
    const bs=Bank.pick(rows,"buildSentence",topics,level,5);
    s.syntax.buildSentence=bs.map(b=>({srcId:b._pk,structure:b.structure,chunks:b.chunks,answer:b.answer,
      explanation:b.explanation,purpose:b.purpose,userOrder:[],revealed:false,correct:null}));
    // 翻譯：最多2題複習變體 + 其餘新題
    const revTrans=due.filter(d=>d.type==="translation").slice(0,2);
    const usedTransIds=new Set();
    const tr=[];
    revTrans.forEach(r=>{const t=rows.find(x=>x._pk===r.itemId);if(t){usedTransIds.add(t._pk);tr.push(mkTrans(t,true));}});
    Bank.pick(rows,"translation",topics,level,5-tr.length).forEach(t=>{if(!usedTransIds.has(t._pk)){usedTransIds.add(t._pk);tr.push(mkTrans(t,false));}});
    s.syntax.translation=tr.slice(0,5);

    // --- 口說 ---
    const spAll=rows.filter(r=>r.type==="speaking");
    const lrRows=spAll.filter(r=>Array.isArray(r.sentences));           // listen_repeat
    const otherRows=spAll.filter(r=>!Array.isArray(r.sentences));       // interview / independent
    const lrByTopic=lrRows.filter(r=>byTopic(r,topics));
    const lrPick=Util.sample(lrByTopic.length?lrByTopic:lrRows,1)[0];
    let intPool=otherRows.filter(r=>byTopic(r,topics));
    if(intPool.length<2)intPool=otherRows;
    const intUse=Util.sample(intPool,Math.min(3,intPool.length));
    s.speaking.listenRepeat=lrPick?{srcId:lrPick._pk,sceneDescription:lrPick.sceneDescription,instruction:lrPick.instruction,
      items:(lrPick.sentences||[]).map((t,i)=>({id:i+1,target:t,audioId:"",transcript:"",score:null,diff:null}))}:null;
    s.speaking.interview=intUse.map(p=>({srcId:p._pk,interviewType:p.subtype||"interview",prompt:p.prompt,
      prepSeconds:p.prepSeconds||15,speakSeconds:p.speakSeconds||45,audioId:"",transcript:"",actualSeconds:0,
      revealed:false,sampleAnswer:"",scores:{content:null,organization:null,language:null,fluency:null},feedback:""}));

    // --- 寫作 ---
    const em=Bank.pick(rows,"writeEmail",topics,level,1)[0];
    s.writing=em?[{srcId:em._pk,situation:em.situation,requirements:em.requirements,keyPoints:em.keyPoints,
      purpose:em.purpose,userAnswer:"",wordCount:0,revealed:false,sampleAnswer:"",
      scores:{task:null,organization:null,language:null,tone:null},feedback:""}]:[];

    Session.cur=s;await DB.put("sessions",s);
    return s;

    function mkVocab(w,fromReview){return {word:w.word,pos:w.pos,zh:w.zh,example:w.example,exampleZh:w.exampleZh||VOCAB_ZH[w.word]||"",note:w.note,fromReview};}
    function mkTrans(t,fromReview){return {srcId:t._pk,zh:t.zh,reference:t.reference,structure:t.structure,purpose:t.purpose,
      userAnswer:"",revealed:false,score:null,errorTypes:[],feedback:"",fromReview};}
    function byTopic(r,tps){return !r.topic||!tps||!tps.length||tps.includes(r.topic);}
  },

  async autoLevel(){
    const list=(await Session.list()).filter(s=>s.status==="completed").slice(0,3);
    if(list.length<1)return "intermediate";
    let acc=[];list.forEach(s=>{if(s.bands&&s.bands.overall!=null)acc.push(s._accuracy||0);});
    const avg=list.reduce((a,s)=>a+(s._accuracy||0),0)/list.length;
    let base=list[0].config&&list[0].config.level||"intermediate";
    const order=["beginner","intermediate","advanced"];
    let i=order.indexOf(base);if(i<0)i=1;
    if(avg>0.9&&i<2)i++;else if(avg<0.6&&i>0)i--;
    return order[i];
  },
};

/* ============================================================
   Scoring — 百分比與 band
   ============================================================ */
const Scoring={
  band(pct){if(pct==null)return null;let b=1+ (pct/100)*5;b=Math.round(b*2)/2;return Math.max(1,Math.min(6,b));},
  reading(s){
    let got=0,tot=0;const r=s.reading;
    if(r.completeWords)r.completeWords.items.forEach(it=>{tot++;if(norm(it.userAnswer)===norm(it.answer))got++;});
    if(r.dailyLife)r.dailyLife.items.forEach(it=>{tot++;if(it.userAnswer===it.answer)got++;});
    if(r.cloze)r.cloze.items.forEach(it=>{tot++;if(it.userAnswer===it.answer)got++;});
    return tot?{pct:got/tot*100,got,tot}:{pct:null,got:0,tot:0};
    function norm(x){return String(x||"").trim().toLowerCase();}
  },
  syntax(s){
    let got=0,tot=0;
    (s.syntax.buildSentence||[]).forEach(b=>{tot+=2;if(b.correct===true)got+=2;});
    (s.syntax.translation||[]).forEach(t=>{tot+=10;if(t.score!=null)got+=t.score;});
    return tot?{pct:got/tot*100,got,tot}:{pct:null,got:0,tot:0};
  },
  speaking(s){
    let got=0,tot=0;const sp=s.speaking;
    if(sp.listenRepeat)sp.listenRepeat.items.forEach(it=>{tot+=3;if(it.score!=null)got+=it.score;});
    (sp.interview||[]).forEach(iv=>{tot+=20;const sc=iv.scores;const sum=(sc.content||0)+(sc.organization||0)+(sc.language||0)+(sc.fluency||0);got+=sum;});
    return tot?{pct:got/tot*100,got,tot}:{pct:null,got:0,tot:0};
  },
  writing(s){
    let got=0,tot=0;
    (s.writing||[]).forEach(w=>{tot+=20;const sc=w.scores;got+=(sc.task||0)+(sc.organization||0)+(sc.language||0)+(sc.tone||0);});
    return tot?{pct:got/tot*100,got,tot}:{pct:null,got:0,tot:0};
  },
  all(s){
    const r=Scoring.reading(s),sy=Scoring.syntax(s),sp=Scoring.speaking(s),w=Scoring.writing(s);
    const bands={reading:Scoring.band(r.pct),syntax:Scoring.band(sy.pct),speaking:Scoring.band(sp.pct),writing:Scoring.band(w.pct)};
    const vals=Object.values(bands).filter(v=>v!=null);
    bands.overall=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*2)/2:null;
    return {parts:{reading:r,syntax:sy,speaking:sp,writing:w},bands};
  },
};

/* ============================================================
   Review — Leitner 間隔複習
   ============================================================ */
const INTERVALS=[1,3,7,14,30];
const Review={
  async queue(){return await DB.metaGet("reviewQueue",[]);},
  async setQueue(q){await DB.metaSet("reviewQueue",q);},
  async due(){const q=await Review.queue();const now=Date.now();
    return q.filter(x=>!x.dueDate||new Date(x.dueDate).getTime()<=now);},
  async add(item){ // item:{itemId,type,errorType}
    const q=await Review.queue();
    let x=q.find(e=>e.itemId===item.itemId&&e.type===item.type);
    if(x){x.box=1;x.dueDate=Review.next(1);x.history.push({at:Util.now(),result:"wrong"});}
    else q.push({itemId:item.itemId,type:item.type,errorType:item.errorType||"",box:1,dueDate:Review.next(1),history:[{at:Util.now(),result:"wrong"}]});
    await Review.setQueue(q);
  },
  async pass(itemId,type){
    const q=await Review.queue();const x=q.find(e=>e.itemId===itemId&&e.type===type);
    if(x){x.box=Math.min(x.box+1,INTERVALS.length);x.dueDate=Review.next(x.box);x.history.push({at:Util.now(),result:"pass"});await Review.setQueue(q);}
  },
  next(box){const days=INTERVALS[Math.max(0,Math.min(box,INTERVALS.length)-1)];
    return new Date(Date.now()+days*86400000).toISOString();},
  // 回合結束時掃描錯誤寫入佇列
  async harvest(s){
    if(s.reading.cloze)for(const it of s.reading.cloze.items)
      if(it.userAnswer!=null&&it.userAnswer!==it.answer)await Review.add({itemId:s.reading.cloze.srcId+"#"+it.id,type:"reading",errorType:it.errorType});
    if(s.reading.dailyLife)for(const it of s.reading.dailyLife.items)
      if(it.userAnswer!=null&&it.userAnswer!==it.answer)await Review.add({itemId:s.reading.dailyLife.srcId+"#"+it.id,type:"reading",errorType:"meaning"});
    for(const t of (s.syntax.translation||[]))
      if(t.score!=null&&t.score<7)await Review.add({itemId:t.srcId,type:"translation",errorType:(t.errorTypes||[])[0]||""});
    if(s.speaking.listenRepeat)for(const it of s.speaking.listenRepeat.items)
      if(it.score!=null&&it.score<2)await Review.add({itemId:s.speaking.listenRepeat.srcId+"#"+it.id,type:"speaking",errorType:"meaning"});
  },
};

/* ============================================================
   Stats — 統計（掃描所有 sessions）
   ============================================================ */
const Stats={
  async compute(){
    const list=(await Session.list());
    const done=list.filter(s=>s.status==="completed");
    const trend={reading:[],syntax:[],speaking:[],writing:[],overall:[]};
    const errCount={};Object.keys(ERRTYPE_ZH).forEach(k=>errCount[k]=0);
    const repWords={};const lrRates=[];const weak={};
    done.forEach(s=>{
      const b=s.bands||{};["reading","syntax","speaking","writing","overall"].forEach(k=>{if(b[k]!=null)trend[k].push({x:s.createdAt,y:b[k]});});
      if(s.reading&&s.reading.cloze)s.reading.cloze.items.forEach(it=>{if(it.userAnswer!=null&&it.userAnswer!==it.answer&&errCount[it.errorType]!=null)errCount[it.errorType]++;});
      (s.syntax&&s.syntax.translation||[]).forEach(t=>{(t.errorTypes||[]).forEach(e=>{if(errCount[e]!=null)errCount[e]++;});});
      ["translation","interview","email"].forEach(sec=>{(s.vocabRepetition&&s.vocabRepetition[sec]||[]).forEach(f=>{repWords[f.word]=(repWords[f.word]||0)+(f.count||1);});});
      if(s.speaking&&s.speaking.listenRepeat){const its=s.speaking.listenRepeat.items.filter(i=>i.score!=null);
        if(its.length){const r=its.reduce((a,i)=>a+i.score,0)/(its.length*3);lrRates.push({x:s.createdAt,y:r});}}
    });
    // 弱點：同一 errorType 出現在 >=2 回合
    const errSessions={};done.forEach(s=>{const seen=new Set();
      if(s.reading&&s.reading.cloze)s.reading.cloze.items.forEach(it=>{if(it.userAnswer!=null&&it.userAnswer!==it.answer)seen.add(it.errorType);});
      (s.syntax&&s.syntax.translation||[]).forEach(t=>(t.errorTypes||[]).forEach(e=>seen.add(e)));
      seen.forEach(e=>{if(!e)return;(errSessions[e]=errSessions[e]||[]).push({id:s.id,at:s.createdAt});});});
    const weakList=Object.entries(errSessions).filter(([e,arr])=>arr.length>=2)
      .map(([e,arr])=>({errorType:e,sessions:arr})).sort((a,b)=>b.sessions.length-a.sessions.length);
    const repRank=Object.entries(repWords).sort((a,b)=>b[1]-a[1]).slice(0,10);
    return {count:done.length,trend,errCount,repRank,lrRates,weakList};
  },
};

/* ============================================================
   Charts — 純 SVG 手刻
   ============================================================ */
const Charts={
  line(series,opts){ // series:[{x:iso,y}], 0..6
    opts=opts||{};const W=opts.w||520,H=opts.h||180,pad=30;
    if(!series.length)return Util.el("div",{class:"muted small",text:"尚無資料"});
    const ys=series.map(p=>p.y);const ymax=opts.ymax||Math.max(6,...ys),ymin=opts.ymin||0;
    const n=series.length;
    const px=i=>pad+ (n===1?(W-2*pad)/2:i*(W-2*pad)/(n-1));
    const py=v=>H-pad-(v-ymin)/(ymax-ymin)*(H-2*pad);
    let path="";series.forEach((p,i)=>{path+=(i?"L":"M")+px(i).toFixed(1)+" "+py(p.y).toFixed(1)+" ";});
    const dots=series.map((p,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="3" fill="var(--accent)"/>`).join("");
    const grid=[0,.25,.5,.75,1].map(f=>{const v=ymin+f*(ymax-ymin);const y=py(v);
      return `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`+
             `<text x="4" y="${y+4}" font-size="10" fill="var(--muted)">${v.toFixed(1)}</text>`;}).join("");
    const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${grid}
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}</svg>`;
    return Util.el("div",{html:svg});
  },
  bars(pairs,opts){ // pairs:[[label,val]]
    opts=opts||{};const W=opts.w||520,rowH=26,pad=90;
    if(!pairs.length)return Util.el("div",{class:"muted small",text:"尚無資料"});
    const max=Math.max(1,...pairs.map(p=>p[1]));
    const H=pairs.length*rowH+10;
    const rows=pairs.map((p,i)=>{const y=i*rowH+8;const w=(W-pad-40)*(p[1]/max);
      return `<text x="0" y="${y+14}" font-size="12" fill="var(--text)">${Util.esc(p[0])}</text>
        <rect x="${pad}" y="${y+4}" width="${w.toFixed(1)}" height="14" rx="3" fill="var(--accent)"/>
        <text x="${pad+w+4}" y="${y+15}" font-size="11" fill="var(--muted)">${p[1]}</text>`;}).join("");
    return Util.el("div",{html:`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${rows}</svg>`});
  },
};

/* ============================================================
   Speech — 語音合成 / 辨識 / 錄音
   ============================================================ */
const Speech={
  recSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);},
  speak(text){return new Promise(res=>{
    try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.95;
      u.onend=()=>res();u.onerror=()=>res();window.speechSynthesis.speak(u);
      // 保險：估計時間後 resolve
      setTimeout(res,Math.max(2500,text.length*90));
    }catch(e){res();}});},
  // 錄音 + 辨識，maxMs 後或靜音自動停；回傳 {blob,transcript}
  async capture(maxMs,silenceMs,onInterim){
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
    catch(e){throw new Error("mic-denied");}
    const chunks=[];let mr=null;
    try{mr=new MediaRecorder(stream,{mimeType:"audio/webm"});}catch(e){try{mr=new MediaRecorder(stream);}catch(e2){mr=null;}}
    if(mr){mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};mr.start();}
    let transcript="",rec=null;
    const RC=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(RC){rec=new RC();rec.lang="en-US";rec.continuous=true;rec.interimResults=true;
      rec.onresult=e=>{let fin="",inte="";for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else inte+=t;}
        if(fin)transcript+=fin;onInterim&&onInterim((transcript+" "+inte).trim());};
      try{rec.start();}catch(e){}}
    return await new Promise(resolve=>{
      let done=false,silTimer=null;
      const finish=()=>{if(done)return;done=true;clearTimeout(hard);clearTimeout(silTimer);
        try{rec&&rec.stop();}catch(e){}
        const stopMr=()=>{stream.getTracks().forEach(t=>t.stop());
          const blob=chunks.length?new Blob(chunks,{type:"audio/webm"}):null;resolve({blob,transcript:transcript.trim()});};
        if(mr&&mr.state!=="inactive"){mr.onstop=stopMr;mr.stop();}else stopMr();};
      const hard=setTimeout(finish,maxMs);
      // 靜音偵測：用辨識間隔近似（每次 onresult 重置）
      if(rec&&silenceMs){const orig=rec.onresult;rec.onresult=e=>{orig(e);clearTimeout(silTimer);silTimer=setTimeout(finish,silenceMs);};}
      Speech._stopCurrent=finish;
    });
  },
  stop(){if(Speech._stopCurrent)Speech._stopCurrent();},
};

/* ============================================================
   AI — Anthropic API
   ============================================================ */
const AI={
  async key(){return await DB.metaGet("apiKey","");},
  async setKey(k){await DB.metaSet("apiKey",k);},
  async has(){return !!(await AI.key());},
  async call(system,user,maxTokens){
    const key=await AI.key();
    if(!key)throw new Error("no-key");
    const res=await fetch(CFG.AI_ENDPOINT,{method:"POST",headers:{
      "content-type":"application/json","x-api-key":key,
      "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:CFG.AI_MODEL,max_tokens:maxTokens||1024,
        system,messages:[{role:"user",content:user}]})});
    if(!res.ok){const t=await res.text();throw new Error("api-"+res.status+":"+t.slice(0,200));}
    const data=await res.json();
    return (data.content||[]).map(c=>c.text||"").join("");
  },
  parseJSON(txt){
    let t=txt.trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim();
    const i=t.indexOf("{"),j=t.lastIndexOf("}");
    if(i>=0&&j>=0)t=t.slice(i,j+1);
    return JSON.parse(t);

/* ============================================================
   Vocab repetition — 本地重複用字檢查
   ============================================================ */
const LOW_VALUE=["good","bad","important","thing","very","a lot","big","small","nice","get","make","do","say","happy","sad","interesting","help","know"];
const REPLACE={
  good:["excellent（更強）","beneficial（正式，有益）","effective（有成效）"],
  bad:["harmful（有害）","poor（品質差）","detrimental（正式，有損）"],
  important:["crucial（關鍵）","significant（顯著）","essential（不可或缺）"],
  thing:["aspect（面向）","factor（因素）","element（要素）"],
  very:["remarkably（顯著地）","particularly（特別）","highly（高度）"],
  "a lot":["considerably（相當多）","significantly（顯著）","a great deal"],
  big:["substantial（可觀）","significant（重大）","considerable（相當大）"],
  small:["minor（次要）","slight（輕微）","modest（不大的）"],
  nice:["pleasant（宜人）","appealing（吸引人）","enjoyable（愉快）"],
  get:["obtain（獲得，正式）","acquire（取得）","receive（收到）"],
  make:["create（創造）","produce（製造）","generate（產生）"],
  do:["perform（執行）","carry out（進行）","conduct（進行研究）"],
  say:["state（陳述）","claim（主張）","argue（論證）"],
  happy:["pleased（高興）","content（滿足）","delighted（十分開心）"],
  sad:["upset（難過）","disappointed（失望）","distressed（苦惱）"],
  interesting:["intriguing（引人入勝）","compelling（有說服力）","fascinating（迷人）"],
  help:["assist（協助，正式）","support（支持）","facilitate（促進）"],
  know:["be aware of（知悉）","recognize（認識到）","understand（理解）"],
};
const Repet={
  lemma(w){return w.replace(/'s$/,"").replace(/(ing|ed|er|s)$/,"");},
  descriptiveOK(w){ // 排除具體名詞的粗略清單（保留描述性字）
    const nouns=["doctor","professor","hospital","student","teacher","school","city","book","country","company","country","people","water","food","money","time","year","day"];
    return !nouns.includes(w);
  },
  check(text){
    const words=Util.normWords(text);
    const counts={};const lowHits={};
    // 片語 a lot
    const joined=" "+words.join(" ")+" ";
    const flags=[];
    // 低分字（含片語）
    LOW_VALUE.forEach(lv=>{
      if(lv.includes(" ")){const c=(joined.match(new RegExp("\\s"+lv.replace(/ /g,"\\s")+"\\s","g"))||[]).length;
        if(c>=1)flags.push({word:lv,count:c,reason:"low"});}
    });
    words.forEach(w=>{const l=Repet.lemma(w);counts[l]=(counts[l]||0)+1;});
    // 重複>=3（僅描述性）
    Object.entries(counts).forEach(([l,c])=>{
      if(LOW_VALUE.includes(l)){flags.push({word:l,count:c,reason:"low"});}
      else if(c>=3&&Repet.descriptiveOK(l)&&l.length>3){flags.push({word:l,count:c,reason:"repeat"});}
    });
    // 去重
    const seen={};const out=[];
    flags.forEach(f=>{if(seen[f.word])return;seen[f.word]=1;
      f.suggestions=REPLACE[f.word]||null;out.push(f);});
    return out;
  },
  // 在原文中把被標記的字上色
  highlight(text,flags){
    if(!flags.length)return Util.esc(text);
    let html=Util.esc(text);
    flags.forEach(f=>{const re=new RegExp("\\b("+f.word.replace(/ /g,"\\s")+")\\b","gi");
      html=html.replace(re,'<span class="hl">$1</span>');});
    return html;
  },
};

/* ============================================================
   Backup — 匯出 / 還原
   ============================================================ */
const Backup={
  blobToB64(blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob);});},
  b64ToBlob(d){const [meta,data]=d.split(",");const mime=(meta.match(/:(.*?);/)||[])[1]||"audio/webm";
    const bin=atob(data);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});},
  download(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);},
  async exportAll(includeAudio){
    const sessions=await DB.getAll("sessions");
    const meta=await DB.getAll("meta").then(m=>m.filter(x=>x.key!=="apiKey")); // 不匯出金鑰
    const questionBank=await DB.getAll("questionBank");
    let audio=[];
    if(includeAudio){const a=await DB.getAll("audio");for(const r of a)audio.push({audioId:r.audioId,data:await Backup.blobToB64(r.blob)});}
    Backup.download({version:1,exportedAt:Util.now(),sessions,meta,questionBank,audio},"toefl_backup_"+Util.stamp()+".json");
  },
  async exportBank(includeGenerated){
    let rows=await DB.getAll("questionBank");
    if(!includeGenerated)rows=rows.filter(r=>!r._generated);
    Backup.download({version:"1.0",format:"TOEFL iBT 2026",exportedAt:Util.now(),rows},
      "questionBank_"+Util.stamp().slice(0,8)+".json");
  },
  async restore(obj){
    if(!obj.version)throw new Error("備份格式無 version 欄位");
    await DB.clear("sessions");await DB.clear("audio");await DB.clear("questionBank");
    for(const s of (obj.sessions||[]))await DB.put("sessions",s);
    for(const q of (obj.questionBank||[]))await DB.put("questionBank",q);
    for(const m of (obj.meta||[]))if(m.key!=="apiKey")await DB.put("meta",m);
    for(const a of (obj.audio||[]))await DB.put("audio",{audioId:a.audioId,blob:Backup.b64ToBlob(a.data)});
  },
  async pruneAudio(){
    const sessions=await Session.list();
    const keep=new Set();sessions.slice(0,CFG.AUDIO_KEEP_SESSIONS).forEach(s=>collectAudioIds(s,keep));
    const all=await DB.getAll("audio");
    for(const a of all)if(!keep.has(a.audioId))await DB.del("audio",a.audioId);
  },
};
function collectAudioIds(s,set){
  if(s.speaking&&s.speaking.listenRepeat)s.speaking.listenRepeat.items.forEach(i=>i.audioId&&set.add(i.audioId));
  (s.speaking&&s.speaking.interview||[]).forEach(i=>i.audioId&&set.add(i.audioId));
}

function completion(s){
  let filled=0,total=0;const t=(a,b)=>{total+=b;filled+=a;};
  const r=s.reading||{};
  if(r.completeWords){const its=r.completeWords.items;t(its.filter(i=>i.userAnswer).length,its.length);}
  if(r.dailyLife){const its=r.dailyLife.items;t(its.filter(i=>i.userAnswer!=null).length,its.length);}
  if(r.cloze){const its=r.cloze.items;t(its.filter(i=>i.userAnswer!=null).length,its.length);}
  (s.syntax&&s.syntax.buildSentence||[]).forEach(b=>t(b.userOrder&&b.userOrder.length?1:0,1));
  (s.syntax&&s.syntax.translation||[]).forEach(t2=>t(t2.userAnswer?1:0,1));
  if(s.speaking&&s.speaking.listenRepeat)s.speaking.listenRepeat.items.forEach(i=>t(i.transcript?1:0,1));
  (s.speaking&&s.speaking.interview||[]).forEach(i=>t(i.transcript?1:0,1));
  (s.writing||[]).forEach(w=>t(w.userAnswer?1:0,1));
  return total?Math.round(filled/total*100):0;
}

// 生成模式：對可生成題型嘗試用 AI 產生（失敗則保留題庫題）
async function maybeGenerate(source){
  if(!(await AI.has()))return;
  const s=Session.cur;const rows=await Bank.all();const {topics,level}=s.config;
  // 只在 generate 或 mixed 的指定部分做，避免太慢：這裡示範對翻譯生成 2 題（mixed）
  try{
    if(source==="generate"){
      // cloze 全生成一題
      const ex=Bank.pick(rows,"cloze",topics,level,2);
      if(ex.length){const g=await AI.generate("cloze",ex.map(clean),topics,level);
        if(g&&g.items){s.reading.cloze={srcId:"gen_"+Util.uid(),passage:g.passage,
          items:g.items.map(it=>({id:it.id,options:it.options,answer:it.answer,errorType:it.errorType,explanation:it.explanation,purpose:it.purpose,userAnswer:null,revealed:false})),_generated:true};}}
    }
    await Session.save();
  }catch(e){console.warn("生成失敗，改用題庫題",e);}
  function clean(r){const o=Object.assign({},r);delete o._pk;delete o.type;return o;}
}

    const box=Util.el("div",{style:"margin:14px 0;border-top:1px solid var(--border);padding-top:10px"});
    box.appendChild(Util.el("div",{class:"muted small",text:"第 "+(idx+1)+" 題　結構："+(b.structure||"")}));
    const slot=Util.el("div",{class:"answer-slot"});
    const pool=Util.el("div",{});
    const correctOrder=deriveOrder(b.chunks,b.answer);
    function render(){
      slot.innerHTML="";pool.innerHTML="";
      b.userOrder.forEach((ci,pos)=>{slot.appendChild(Util.el("span",{class:"chunk",onclick:()=>{
        b.userOrder.splice(pos,1);b.correct=null;Persist.touch();render();}},[b.chunks[ci]]));});
      b.chunks.forEach((ch,ci)=>{const used=b.userOrder.includes(ci);
        pool.appendChild(Util.el("span",{class:"chunk"+(used?" used":""),onclick:()=>{
          if(used)return;b.userOrder.push(ci);Persist.touch();render();}},[ch]));});
    }
    render();
    box.appendChild(slot);box.appendChild(pool);
    const ctl=Util.el("div",{class:"rec-row"});
    ctl.appendChild(Util.el("button",{onclick:()=>{b.userOrder=[];b.correct=null;Persist.touch();render();}},["重置"]));
    ctl.appendChild(Util.el("button",{onclick:()=>{
      b.correct=JSON.stringify(b.userOrder)===JSON.stringify(correctOrder);Persist.touch();
      msg.textContent=b.correct?"✓ 正確":"✗ 語序不對，可重排或看解答";msg.className=b.correct?"ok small":"bad small";
    }},["檢查"]));
    const msg=Util.el("span",{class:"small"});ctl.appendChild(msg);
    box.appendChild(ctl);
    box.appendChild(revealBlock(()=>b.revealed,v=>b.revealed=v,()=>Util.el("div",{},[
      Util.el("div",{class:"eng",html:"<strong>"+Util.esc(b.answer)+"</strong>"}),
      Util.el("div",{class:"muted small",text:b.explanation}),
      Util.el("div",{class:"muted small",text:"🎯 "+b.purpose})])));
    c1.appendChild(box);
  });
  root.appendChild(c1);

  // B. 中翻英
  const c2=Util.el("div",{class:"card"});
  c2.appendChild(Util.el("h2",{text:"B. 中翻英"}));
  (s.syntax.translation||[]).forEach((t,idx)=>{
    const box=Util.el("div",{style:"margin:14px 0;border-top:1px solid var(--border);padding-top:10px"});
    box.appendChild(Util.el("div",{},[Util.el("strong",{text:(idx+1)+". "}),t.zh,
      t.fromReview?Util.el("span",{class:"chip tag-review",text:"複習變體"}):null]));
    const ta=Util.el("textarea",{rows:2,placeholder:"輸入英文翻譯…"});ta.value=t.userAnswer||"";
    ta.addEventListener("input",()=>{t.userAnswer=ta.value;Persist.touch();});
    box.appendChild(ta);
    box.appendChild(revealBlock(()=>t.revealed,v=>t.revealed=v,()=>buildTransReveal(t)));
    c2.appendChild(box);
  });
  // 重複用字檢查（整個中翻英部分）
  c2.appendChild(repetitionSection("translation",()=> (s.syntax.translation||[]).map(t=>t.userAnswer).join(" "),s));
  root.appendChild(c2);

  function buildTransReveal(t){
    const d=Util.el("div",{});
    d.appendChild(Util.el("div",{class:"small"},[Util.el("strong",{text:"參考翻譯："})]));
    (t.reference||[]).forEach(r=>d.appendChild(Util.el("div",{class:"eng small",text:"• "+r})));
    const fb=Util.el("div",{class:"small",style:"margin-top:8px"});
    d.appendChild(fb);
    if(t.score!=null){fb.innerHTML=`<strong>評分：${t.score}/10　${t.feedback?Util.esc(t.feedback):""}</strong>`;}
    else{
      const b=Util.el("button",{onclick:async()=>{
        if(!t.userAnswer){alert("尚未作答");return;}
        if(!(await AI.has())){fb.innerHTML='<span class="warn">未設定 API 金鑰，無法自動評分。以上為參考翻譯。</span>';return;}
        b.disabled=true;b.textContent="評分中…";
        try{const g=await AI.gradeTranslation(t.zh,t.reference,t.userAnswer);
          t.score=g.score;t.errorTypes=g.errorTypes||[];t.feedback=(g.verdict?"["+g.verdict+"] ":"")+(g.analysis||"")+(g.better?"　更佳："+g.better:"");
          await Session.save();fb.innerHTML=`<strong>評分：${t.score}/10</strong><div class="muted">${Util.esc(t.feedback)}</div>`;
        }catch(e){fb.innerHTML='<span class="bad">評分失敗：'+Util.esc(e.message)+'</span>';b.disabled=false;b.textContent="AI 評分";}
      }},["AI 評分（滿分10）"]);
      d.appendChild(b);
    }
    d.appendChild(Util.el("div",{class:"muted small",style:"margin-top:6px",text:"🎯 "+t.purpose}));
    return d;
  }
  function deriveOrder(chunks,answer){
    const na=answer.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,"");
    const idx=chunks.map((ch,i)=>{const key=ch.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,"");return {i,pos:na.indexOf(key)};});
    idx.sort((a,b)=>a.pos-b.pos);
    return idx.map(x=>x.i);
  }
}

  const fb=Util.el("div",{class:"small"});d.appendChild(fb);
  const render=()=>{if(w.scores.task!=null){const sc=w.scores;
    fb.innerHTML=`<strong>任務達成 ${sc.task}/5　組織 ${sc.organization}/5　語言 ${sc.language}/5　語氣 ${sc.tone}/5</strong>`+
      `<div class="muted">${Util.esc(w.feedback||"")}</div>`+
      `<div style="margin-top:8px"><strong>範例回信：</strong></div><div class="eng">${Util.esc(w.sampleAnswer||"")}</div>`+
      (w.phrases&&w.phrases.length?`<div style="margin-top:8px"><strong>可用句型：</strong></div>`+w.phrases.map(p=>`<div class="eng muted">• ${Util.esc(p)}</div>`).join(""):``);}};
  if(w.scores.task!=null)render();
  else{const b=Util.el("button",{onclick:async()=>{
    if(!w.userAnswer){alert("尚未作答");return;}
    if(!(await AI.has())){fb.innerHTML='<span class="warn">未設定 API 金鑰，無法自動評分與生成範例。</span>';return;}
    b.disabled=true;b.textContent="評分中…";
    try{const g=await AI.gradeEmail(w.situation,w.requirements,w.userAnswer);
      w.scores=g.scores;w.feedback=g.feedback;w.sampleAnswer=g.sampleAnswer;w.phrases=g.phrases||[];
      await Session.save();b.remove();render();
    }catch(e){fb.innerHTML='<span class="bad">評分失敗：'+Util.esc(e.message)+'</span>';b.disabled=false;b.textContent="AI 評分";}
  }},["AI 評分 + 範例回信"]);d.appendChild(b);}
  d.appendChild(repetitionSection("email",()=>w.userAnswer||"",s));
  return d;
}

/* ---- Listen&Repeat 評分與 diff ---- */
function scoreLR(target,transcript){
  const a=Util.normWords(target),b=Util.normWords(transcript);
  if(!a.length)return 0;
  const ops=Util.align(a,b);const matched=ops.filter(o=>o.t==="match").length;
  const ratio=matched/a.length;
  if(ratio>=0.9)return 3;if(ratio>=0.7)return 2;if(ratio>=0.4)return 1;return 0;
}
function renderDiff(target,transcript){
  const a=Util.normWords(target),b=Util.normWords(transcript);
  const ops=Util.align(a,b);
  return ops.map(o=>{
    if(o.t==="match")return Util.esc(o.b);
    if(o.t==="del")return '<span class="diff-del">'+Util.esc(o.a)+'</span>';
    if(o.t==="ins")return '<span class="diff-ins">'+Util.esc(o.b)+'</span>';
    if(o.t==="sub")return '<span class="diff-del">'+Util.esc(o.a)+'</span> <span class="diff-ins">'+Util.esc(o.b)+'</span>';
  }).join(" ");
}

async function countdown(elm,secs,label){
  return new Promise(res=>{let n=secs;elm.textContent=(label||"")+n;
    const t=setInterval(()=>{n--;if(n<=0){clearInterval(t);res();}else elm.textContent=(label||"")+n;},1000);});}

/* ---------- 回合結束總評 ---------- */
async function finishSession(){
  const s=Session.cur;const {parts,bands}=Scoring.all(s);
  s.bands=bands;
  // 準確率供自動難度
  const tot=parts.reading.tot+parts.syntax.tot+parts.speaking.tot+parts.writing.tot;
  const got=parts.reading.got+parts.syntax.got+parts.speaking.got+parts.writing.got;
  s._accuracy=tot?got/tot:0;
  s.status="completed";
  await Review.harvest(s);
  await Session.save();
  await Backup.pruneAudio();
  showSummary(s,parts,bands);
}
function showSummary(s,parts,bands){
  const bg=Util.el("div",{class:"modal-bg"});const m=Util.el("div",{class:"modal"});
  m.appendChild(Util.el("h2",{text:"回合總評"}));
  m.appendChild(Util.el("div",{class:"band",text:"總評 band "+(bands.overall!=null?bands.overall.toFixed(1):"—")}));
  m.appendChild(Util.el("p",{class:"muted small",text:"非 ETS 官方換算，僅供自我追蹤。"}));
  [["reading","閱讀"],["syntax","句構與翻譯"],["speaking","口說"],["writing","寫作"]].forEach(([k,zh])=>{
    const p=parts[k];
    m.appendChild(Util.el("div",{class:"scoreline"},[Util.el("span",{text:zh}),
      Util.el("span",{class:"small muted",text:p.pct!=null?`${p.got}/${p.tot}　band ${bands[k]!=null?bands[k].toFixed(1):"—"}`:"未作答"})]));
    const bar=Util.el("div",{class:"bar"});bar.appendChild(Util.el("i",{style:"width:"+(p.pct||0)+"%"}));m.appendChild(bar);
  });
  m.appendChild(Util.el("div",{class:"rec-row"},[
    Util.el("button",{class:"primary",onclick:()=>{bg.remove();renderHome();}},["回首頁"]),
    Util.el("button",{class:"ghost",onclick:()=>bg.remove()},["繼續檢視"]),
  ]));
  bg.appendChild(m);document.body.appendChild(bg);
}

  const wrap=Util.el("div",{class:"wrap"});
  wrap.appendChild(Util.el("div",{class:"topbar"},[Util.el("button",{class:"ghost",onclick:renderHome},["← 首頁"]),Util.el("strong",{text:"資料管理"})]));

  ck.appendChild(Util.el("p",{class:"muted small",html:"金鑰僅存在本機瀏覽器（IndexedDB），供 AI 生成題目與評分自由作答使用。<strong>注意：直接從瀏覽器呼叫會帶 <code>anthropic-dangerous-direct-browser-access</code> 標頭，金鑰會暴露在前端，請只在自己的電腦使用。</strong>"}));

  const modeSel=Util.el("select",{style:"width:auto;display:inline-block"});
  [["merge","合併（id 相同覆蓋）"],["replace","取代（清空後重建）"]].forEach(([v,t])=>modeSel.appendChild(Util.el("option",{value:v,text:t})));
  const fileInp=Util.el("input",{type:"file",accept:".json"});
  const rep=Util.el("div",{class:"small",style:"margin-top:8px"});
  cb.appendChild(Util.el("div",{class:"rec-row"},[Util.el("span",{class:"small",text:"模式："}),modeSel]));
  cb.appendChild(fileInp);
  cb.appendChild(Util.el("div",{class:"rec-row"},[
    Util.el("button",{class:"primary",onclick:async()=>{
      const f=fileInp.files[0];if(!f){alert("請先選擇 JSON 檔");return;}
      const txt=await f.text();let bank;try{bank=JSON.parse(txt);}catch(e){rep.innerHTML='<span class="bad">JSON 解析失敗</span>';return;}
      // 支援兩種格式：完整題庫檔 或 匯出的 {rows:[...]}
      if(bank.rows&&!bank.vocab)bank=rowsToBank(bank.rows);
      await doImport(bank,modeSel.value,rep);
    }},["從檔案匯入"]),
    Util.el("button",{onclick:async()=>{await doImport(SEED_BANK,modeSel.value,rep);}},["載入內建範例題庫"]),
  ]));
  cb.appendChild(rep);
  wrap.appendChild(cb);

  // 備份
  const cbk=Util.el("div",{class:"card"});cbk.appendChild(Util.el("h2",{text:"備份"}));
  const incAudio=Util.el("input",{type:"checkbox"});
  const incGen=Util.el("input",{type:"checkbox"});
  cbk.appendChild(Util.el("label",{class:"blk small"},[incAudio," 匯出全部時包含錄音檔（檔案會變大）"]));
  cbk.appendChild(Util.el("div",{class:"rec-row"},[
    Util.el("button",{class:"primary",onclick:async()=>{await Backup.exportAll(incAudio.checked);await DB.metaSet("lastBackup",Util.now());alert("已匯出備份（不含 API 金鑰）");}},["匯出全部"]),
  ]));
  cbk.appendChild(Util.el("label",{class:"blk small"},[incGen," 匯出題庫時包含 AI 生成的題目"]));
  cbk.appendChild(Util.el("div",{class:"rec-row"},[
    Util.el("button",{onclick:async()=>{await Backup.exportBank(incGen.checked);}},["匯出題庫"]),
  ]));
  const restoreInp=Util.el("input",{type:"file",accept:".json"});
  cbk.appendChild(Util.el("h3",{text:"還原備份"}));
  cbk.appendChild(restoreInp);
  cbk.appendChild(Util.el("div",{class:"rec-row"},[Util.el("button",{class:"ghost",onclick:async()=>{
    const f=restoreInp.files[0];if(!f){alert("請選擇備份檔");return;}
    const obj=JSON.parse(await f.text());
    if(!obj.version){alert("非本程式的備份檔");return;}
    const n=(obj.sessions||[]).length;
    if(!confirm(`還原將覆蓋現有資料，共 ${n} 個回合將取代目前內容。確定？`))return;
    await withLoading("還原中…",()=>Backup.restore(obj));
    alert("還原完成");renderHome();
  }},["選擇備份檔並還原"])]));

  ]));
  wrap.appendChild(cd);

  mount(wrap);

  async function doImport(bank,mode,repEl){
    await withLoading("匯入中…",async()=>{
      const res=await Bank.import(bank,mode);
      let html=`<span class="ok">成功匯入 ${res.imported} 題`+(res.skipped.length?`，跳過 ${res.skipped.length} 題</span>`:"</span>");
      if(res.skipped.length){html+="<div class='muted'>跳過原因：</div>";

      repEl.innerHTML=html;

  function rowsToBank(rows){
    const bank={version:"1.0",enums:SEED_BANK.enums,vocab:[],completeWords:[],dailyLifeReading:[],cloze:[],buildSentence:[],translation:[],speaking:[],writeEmail:[]};
    rows.forEach(r=>{const o=Object.assign({},r);const t=o.type;delete o._pk;delete o.type;
      if(bank[t])bank[t].push(o);});
    return bank;
  }
}
